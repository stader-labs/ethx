[profile.default]
evm_version = "shanghai"       # See https://www.evmdiff.com/features?name=PUSH0&kind=opcode
src = "contracts"
out = "out"
libs = ["node_modules", "lib"]
test = "test"
cache_path = "cache_forge"
optimizer = true
optimizer_runs = 10_000
solc_version = "0.8.16"
build_info = true
extra_output = ["storageLayout"]
no_match_path = "test/fork/sunset/**/*.t.sol"

[profile.ci]
fuzz = { runs = 10_000 }
verbosity = 4
no_match_path = "test/fork/sunset/**/*.t.sol"

[profile.fork]
match_path = "test/fork/sunset/**/*.t.sol"
no_match_path = "test/foundry_tests/**/*.t.sol"
fs_permissions = [
    { access = "read", path = "./test/fork/sunset/fixtures" },
    { access = "read", path = "./test/fork/sunset/layouts" },
    { access = "read-write", path = "./test/fork/sunset/snapshots" },
]

[fmt]
bracket_spacing = true
int_types = "long"
line_length = 120
multiline_func_header = "all"
number_underscore = "thousands"
quote_style = "double"
tab_width = 4
wrap_comments = true

[rpc_endpoints]
localhost = "http://localhost:8545"
goerli = "https://eth-goerli.nodereal.io/v1/${API_KEY_NODE_REAL}"
mainnet = "https://eth-mainnet.nodereal.io/v1/${API_KEY_NODE_REAL}"


